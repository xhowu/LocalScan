# 依赖更新机器人配置
#
# 作用：定期检查项目引用的第三方库有没有新版本、有没有已知安全漏洞，
# 有的话自动开一个 PR，你审核后合并即可。它跑在 GitHub 服务器上，不需要本地环境。
#
# 文档：https://docs.github.com/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # —— 前端依赖（React / Capacitor / Vite 等）——
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - dependencies
    groups:
      # 小版本与补丁合并成一个 PR，避免刷屏
      npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # 大版本一律不自动开 PR，全部人工确认。理由：
      #   · Capacitor / React / Vite / TypeScript 的大版本会连带改原生工程或构建配置；
      #   · @types/* 的大版本常与运行时版本不匹配（实测自动开出 @types/node 24 → 26）。
      # 注意：这里只影响「版本更新」。安全更新由仓库的 Dependabot security updates 单独处理，
      # 不受 ignore 影响，有漏洞仍会自动修复。
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # —— Android 原生依赖（Gradle）——
  - package-ecosystem: gradle
    directory: /app/android
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(android-deps)'
    labels:
      - dependencies
      - android
    ignore:
      # 实测它会直接开出 gradle-wrapper 8.14.3 → 9.8.0 这类大版本。
      # Gradle 与 Android Gradle Plugin 的大版本升级会改构建脚本与插件 API，
      # 必须人工单独立分支验证（本项目历史上 wrapper 曾不可用，改错了整个 Android 构建就废）。
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # —— GitHub Actions 自身 ——
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(ci)'
    labels:
      - dependencies
      - ci
