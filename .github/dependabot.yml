# 依赖更新机器人配置
#
# Dependabot 是 GitHub 自带的机器人，跑在 GitHub 服务器上，不需要本地环境，
# 会产生两类 PR：
#   · 版本更新（version updates）——「上游有新版本了」，由本文件控制
#   · 安全更新（security updates）——「你用的版本有漏洞，这是修复版」，由仓库设置控制
#
# ── 当前策略：停用「版本更新」，只保留「安全更新」──
#
#   open-pull-requests-limit: 0 的官方语义就是「临时停用该生态的版本更新」，
#   而安全更新不受该上限约束、也不计入它，仍然会自动开 PR。官方原文：
#     "You can temporarily disable version updates for a package manager
#      by setting this option to zero."
#     "Security update pull requests are not subject to this limit and do not
#      count toward it."
#
#   效果：不再收到「有新版本了」的提醒（升级改为人工按需处理，尤其原生依赖
#   必须本地构建一次 APK 才算验过，CI 覆盖不到那一层）；
#   一旦某个依赖爆出漏洞且存在修复版，仍会自动开 PR 提醒。
#
# ── 想恢复自动提醒 ──
#   把下面三处 open-pull-requests-limit 从 0 改回 5（或你想要的数字）即可。
# ── 想手动看有哪些新版本 ──
#   在 app/ 下执行：npm outdated
#
# 文档：https://docs.github.com/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # —— 前端依赖（React / Capacitor / Vite 等）——
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0 # 0 = 停用版本更新 PR（安全更新不受影响）
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - dependencies
    groups:
      # 小版本与补丁合并成一个 PR，避免刷屏
      npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # 大版本一律人工处理。保留此规则：日后恢复版本更新时它仍然生效。
      #   · Capacitor / React / Vite / TypeScript 的大版本会连带改原生工程或构建配置；
      #   · @types/* 的大版本常与运行时版本不匹配（曾自动开出 @types/node 24 → 26）。
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # —— Android 原生依赖（Gradle）——
  - package-ecosystem: gradle
    directory: /app/android
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0
    commit-message:
      prefix: 'chore(android-deps)'
    labels:
      - dependencies
      - android
    ignore:
      # 曾直接开出 gradle-wrapper 8.14.3 → 9.8.0 这类大版本。
      # Gradle 与 AGP 的大版本会改构建脚本与插件 API，必须人工单独立分支验证。
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # —— GitHub Actions 自身 ——
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0
    commit-message:
      prefix: 'chore(ci)'
    labels:
      - dependencies
      - ci
