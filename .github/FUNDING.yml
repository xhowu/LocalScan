# 赞助入口配置（可选）
#
# 当前保持全部注释：GitHub 只有在检测到「至少一个有效平台」时才会显示 Sponsor 按钮，
# 全注释等于不显示，不会出现点了没反应的假按钮。
#
# 以后想开通，取消对应行的注释并填上账号即可；改完不需要动代码。
# 文档：https://docs.github.com/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/displaying-a-sponsor-button-in-your-repository

# github: [xhowu]
# patreon: # 替换为你的 Patreon 用户名
# open_collective: # 替换为你的 Open Collective 名称
# ko_fi: # 替换为你的 Ko-fi 用户名
# tidelift: # 例：npm/localscan
# community_bridge: # 替换为你的 Cloud Native Computing Foundation 项目名
# liberapay: # 替换为你的 Liberapay 用户名
# issuehunt: # 替换为你的 IssueHunt 用户名
# lfx_crowdfunding: # 替换为你的 LFX Crowdfunding 项目名
# polar: # 替换为你的 Polar 用户名
# buy_me_a_coffee: # 替换为你的 Buy Me a Coffee 用户名
# thanks_dev: # 替换为你的 thanks.dev 用户名
# custom: ['https://example.com/donate'] # 最多 4 个自定义赞助链接
